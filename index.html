<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Bible Apps</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Ícones em SVG
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Key: <path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />,
                Globe: <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />,
                Library: <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
                Book: <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
                Folder: <path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />,
                List: <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />,
                FileText: <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,
                Play: <path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />,
                Code: <path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />,
                Layout: <path strokeLinecap="round" strokeLinejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
                ExternalLink: <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
                AlertCircle: <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    {icons[name] || icons.Globe}
                </svg>
            );
        };

        // Função que gera dados simulados para quando não houver chave de API (Modo Demo)
        const getMockData = (path) => {
            const cleanPath = path.split('?')[0];

            if (cleanPath === '/languages') {
                return { data: [ 
                    { id: 6414, iso: "por", name: "Portuguese", autonym: "Português" }, 
                    { id: 123, iso: "eng", name: "English", autonym: "English" }, 
                    { id: 456, iso: "spa", name: "Spanish", autonym: "Español" }, 
                    { id: 789, iso: "fra", name: "French", autonym: "Français" },
                    { id: 101, iso: "deu", name: "German", autonym: "Deutsch" }
                ] };
            }

            if (cleanPath === '/bibles') {
                return { data: [ 
                    { abbr: "PORARA", name: "Almeida Revista e Atualizada", language: "Portuguese" }, 
                    { abbr: "PORARC", name: "Almeida Revista e Corrigida", language: "Portuguese" }, 
                    { abbr: "PORNVI", name: "Nova Versão Internacional", language: "Portuguese" },
                    { abbr: "PORNVT", name: "Nova Versão Transformadora", language: "Portuguese" } 
                ] };
            }

            if (cleanPath.match(/^\/bibles\/[A-Za-z0-9_-]+$/)) {
                const abbr = cleanPath.split('/').pop();
                return { data: { 
                    abbr: abbr, 
                    name: `Tradução Demonstrativa (${abbr})`, 
                    language: "Portuguese", 
                    description: "Esta é uma descrição gerada em Modo de Demonstração. Em uma chamada real, aqui estariam os metadados oficias da Digital Bible Platform, incluindo informações de copyright, organização e links.", 
                    filesets: { "dbp-dev": [ { id: `${abbr}N2DA`, set_type_code: "audio" }, { id: abbr, set_type_code: "text_plain" } ] } 
                } };
            }

            if (cleanPath.match(/^\/bibles\/filesets\/[A-Za-z0-9_-]+\/book$/)) {
                return { data: [ 
                    { book_id: "GEN", name: "Gênesis" }, 
                    { book_id: "EXO", name: "Êxodo" }, 
                    { book_id: "LEV", name: "Levítico" }, 
                    { book_id: "PSA", name: "Salmos" }, 
                    { book_id: "PRO", name: "Provérbios" }, 
                    { book_id: "MAT", name: "Mateus" }, 
                    { book_id: "MRK", name: "Marcos" }, 
                    { book_id: "LUK", name: "Lucas" }, 
                    { book_id: "JHN", name: "João" },
                    { book_id: "REV", name: "Apocalipse" }
                ] };
            }

            if (cleanPath.match(/^\/bibles\/filesets\/[A-Za-z0-9_-]+\/[A-Z1-3]+\/[0-9]+$/)) {
                const parts = cleanPath.split('/');
                const chap = parts.pop();
                const book = parts.pop();
                return { data: [ 
                    { book_id: book, chapter_start: chap, verse_start: 1, verse_text: `[TEXTO SIMULADO] Este é um texto de demonstração gerado automaticamente para o livro de ${book}, capítulo ${chap}, versículo 1.` },
                    { book_id: book, chapter_start: chap, verse_start: 2, verse_text: `Como a aplicação está sendo executada em "Modo Demo" sem uma chave de API real preenchida no código fonte, os textos originais não foram baixados.` },
                    { book_id: book, chapter_start: chap, verse_start: 3, verse_text: `A interface do leitor demonstra como a leitura é apresentada aos usuários, de forma fluida, limpa e elegante, organizando adequadamente cada versículo retornado pelo JSON.` },
                    { book_id: book, chapter_start: chap, verse_start: 4, verse_text: `Para visualizar o conteúdo oficial real de todos os milhares de idiomas, altere a constante "publicApiKey" para uma chave válida no código.` }
                ] };
            }

            return null; // Endpoint não mapeado no mock
        };

        // Componente Inteligente de Visualização de Dados
        const Visualizer = ({ response, onNavigate }) => {
            if (!response) return null;

            const data = response.data || response;
            const items = Array.isArray(data) ? data : [data];
            
            if (items.length === 0) {
                return <div className="text-gray-500 text-center py-10">Lista vazia retornada pela API.</div>;
            }

            const first = items[0];

            // 1. Lista de Bíblias (Ex: /bibles)
            if (first.abbr && first.name && first.language) {
                return (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        {items.map(b => (
                            <div key={b.abbr} onClick={() => onNavigate(`/bibles/${b.abbr}`)} 
                                 className="p-5 border border-slate-200 rounded-xl shadow-sm bg-white hover:shadow-md hover:border-indigo-300 transition cursor-pointer border-l-4 border-l-indigo-500">
                                <h3 className="font-bold text-lg text-slate-800">{b.name}</h3>
                                <div className="mt-3 flex justify-between items-center text-sm text-slate-600">
                                    <span className="bg-slate-100 px-2 py-1 rounded font-mono text-xs">{b.abbr}</span>
                                    <span>{b.language}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                );
            }

            // 2. Detalhes de uma Bíblia e seus Filesets (Ex: /bibles/PORARA)
            if (data.abbr && data.name && data.filesets) {
                // Pega a primeira chave de organização (geralmente 'BibleBrain' ou 'dbp-dev')
                const orgKey = Object.keys(data.filesets)[0];
                const filesets = orgKey ? data.filesets[orgKey] : [];
                
                return (
                    <div className="space-y-6">
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <h2 className="text-3xl font-bold text-slate-800">{data.name}</h2>
                            {data.description && <p className="text-slate-600 mt-2">{data.description}</p>}
                            <div className="mt-4 flex flex-wrap gap-3 text-sm">
                                <span className="bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-full font-medium">ID: {data.abbr}</span>
                                <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-full font-medium">Idioma: {data.language}</span>
                            </div>
                        </div>
                        
                        <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="Folder" className="text-indigo-600" /> Filesets Disponíveis
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {filesets.map((f, i) => (
                                <div key={i} onClick={() => onNavigate(`/bibles/filesets/${f.id}/book`)} 
                                     className="p-4 border border-slate-200 rounded-xl bg-white hover:border-indigo-400 hover:bg-indigo-50 transition cursor-pointer flex items-center justify-between group">
                                    <div>
                                        <div className="font-mono font-bold text-indigo-800 text-lg">{f.id}</div>
                                        <div className="text-xs text-slate-500 mt-1 uppercase font-semibold tracking-wider bg-slate-100 inline-block px-2 py-0.5 rounded">
                                            {f.set_type_code.replace(/_/g, ' ')}
                                        </div>
                                    </div>
                                    <Icon name="List" className="text-slate-300 group-hover:text-indigo-500 transition" />
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // 3. Lista de Livros (Ex: /bibles/filesets/PORARA/book)
            if (first.book_id && first.name) {
                return (
                    <div>
                        <div className="mb-4 text-sm text-slate-500 flex items-center gap-2 bg-blue-50 p-3 rounded-lg text-blue-800">
                            <Icon name="AlertCircle" className="w-5 h-5 shrink-0" />
                            <span>Para ler/ouvir, clique em um livro. Ele montará a URL para o Capítulo 1 automaticamente. (Substitua na URL se desejar outro capítulo).</span>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                            {items.map(b => (
                                <div key={b.book_id} 
                                     onClick={() => {
                                        // Extrai o fileset ID da URL atual heurísticamente, se possível
                                        const match = window.currentPath?.match(/\/filesets\/([A-Za-z0-9_-]+)\//);
                                        const fsId = match ? match[1] : 'ID_AQUI';
                                        onNavigate(`/bibles/filesets/${fsId}/${b.book_id}/1`);
                                     }} 
                                     className="p-3 border border-slate-200 rounded-xl bg-white text-center hover:bg-indigo-50 hover:border-indigo-300 transition cursor-pointer">
                                    <div className="font-bold text-slate-800 truncate" title={b.name}>{b.name}</div>
                                    <div className="text-xs text-slate-400 mt-1 font-mono">{b.book_id}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // 4. Texto do Capítulo (Ex: /bibles/filesets/PORARA/GEN/1)
            if (first.book_id && first.verse_text) {
                return (
                    <div className="p-6 md:p-10 bg-white border border-slate-200 rounded-2xl shadow-sm max-w-4xl mx-auto">
                        <h2 className="text-3xl font-bold mb-8 text-center text-slate-800 border-b border-slate-100 pb-4">
                            {first.book_id} {first.chapter_start}
                        </h2>
                        <div className="text-lg leading-loose text-slate-800 font-serif">
                            {items.map(v => (
                                <span key={v.verse_start} className="hover:bg-yellow-100 transition-colors duration-200 rounded px-0.5">
                                    <sup className="text-indigo-500 font-bold mr-1.5 text-xs select-none">{v.verse_start}</sup>
                                    {v.verse_text}{' '}
                                </span>
                            ))}
                        </div>
                    </div>
                );
            }

            // 5. Áudio do Capítulo
            if (first.book_id && first.path && !first.verse_text) {
                return (
                    <div className="p-8 bg-white border border-slate-200 rounded-2xl shadow-sm max-w-3xl mx-auto text-center">
                        <h2 className="text-2xl font-bold mb-6 text-slate-800 border-b pb-4">{first.book_id} {first.chapter_start} (Áudio)</h2>
                        <div className="space-y-4">
                            {items.map((item, idx) => (
                                <div key={idx} className="flex flex-col items-center gap-3 p-6 border border-slate-100 rounded-xl bg-slate-50">
                                    <span className="text-sm font-semibold text-slate-600 uppercase tracking-wider">
                                        {item.verse_start ? `Versículo ${item.verse_start}` : 'Capítulo Completo'}
                                    </span>
                                    <audio controls src={item.path} className="w-full max-w-md"></audio>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // 6. Lista de Idiomas (Ex: /languages)
            if (first.iso && first.name) {
                return (
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        {items.map(l => (
                            <div key={l.id} onClick={() => onNavigate(`/bibles?language_code=${l.iso}`)} 
                                 className="p-4 border border-slate-200 rounded-xl bg-white hover:shadow-md hover:border-indigo-300 transition cursor-pointer">
                                <div className="font-bold text-slate-800">{l.name}</div>
                                {l.autonym && l.autonym !== l.name && <div className="text-sm text-slate-500 italic mt-0.5">{l.autonym}</div>}
                                <div className="mt-4 flex justify-between text-xs text-slate-400 font-mono bg-slate-50 p-1.5 rounded">
                                    <span>{l.iso}</span>
                                    <span>{l.id}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                );
            }

            // Fallback genérico para JSON Array desconhecido
            if (first && typeof first === 'object') {
                const keys = Object.keys(first).slice(0, 6); 
                return (
                    <div className="overflow-x-auto bg-white border border-slate-200 rounded-xl shadow-sm">
                        <table className="w-full text-sm text-left text-slate-600">
                            <thead className="text-xs text-slate-700 uppercase bg-slate-50 border-b border-slate-200">
                                <tr>{keys.map(k => <th key={k} className="px-6 py-4">{k}</th>)}</tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {items.map((item, idx) => (
                                    <tr key={idx} className="bg-white hover:bg-slate-50">
                                        {keys.map(k => <td key={k} className="px-6 py-3 truncate max-w-[200px]" title={String(item[k])}>{String(item[k])}</td>)}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                );
            }

            return (
                <div className="bg-amber-50 p-6 border border-amber-200 rounded-xl text-amber-800 flex flex-col items-center text-center">
                    <Icon name="Layout" className="w-10 h-10 mb-3 text-amber-500 opacity-50" />
                    <p className="font-medium">Visualização rica não suportada para este formato.</p>
                    <p className="text-sm mt-1">Por favor, utilize a aba "Resposta JSON" para ver os dados.</p>
                </div>
            );
        };

        const presets = [
            { name: 'Idiomas Disponíveis', path: '/languages?limit=50', icon: 'Globe', desc: 'Explore milhares de idiomas' },
            { name: 'Bíblias em Português', path: '/bibles?language_code=por', icon: 'Library', desc: 'Lista de traduções' },
            { name: 'Detalhes da Almeida', path: '/bibles/PORARA', icon: 'Book', desc: 'Metadados da tradução' },
            { name: 'Livros Disponíveis', path: '/bibles/filesets/PORARA/book', icon: 'List', desc: 'Estrutura da Bíblia' },
            { name: 'Ler Gênesis 1', path: '/bibles/filesets/PORARA/GEN/1', icon: 'FileText', desc: 'Texto formatado' },
        ];

        function App() {
            const [endpoint, setEndpoint] = useState('/bibles?language_code=por');
            const [loading, setLoading] = useState(false);
            const [response, setResponse] = useState(null);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState('visual');
            const [history, setHistory] = useState([]);

            const publicApiKey = 'SUA_CHAVE_API_AQUI'; // <--- Se for preenchida com chave real, sairá do Modo Demo automaticamente.

            const executeRequest = async (overrideEndpoint = null) => {
                const path = overrideEndpoint || endpoint;
                
                setEndpoint(path);
                window.currentPath = path; // Gambiarra simples para usar no renderizador visual
                setLoading(true);
                setError(null);
                
                // MODO DEMO: Se não possuir chave inserida
                if (publicApiKey === 'SUA_CHAVE_API_AQUI') {
                    const mockResponse = getMockData(path);
                    
                    // Simula delay de rede para manter a experiência realista
                    setTimeout(() => {
                        if (mockResponse) {
                            setResponse(mockResponse);
                            setActiveTab('visual');
                        } else {
                            setError("Modo de Demonstração: Este endpoint específico não está mapeado no mock de dados. Configure uma chave de API válida no código fonte para testar rotas livres.");
                            setResponse(null);
                        }
                        
                        if (!history.includes(path)) {
                            setHistory(prev => [path, ...prev].slice(0, 8));
                        }
                        setLoading(false);
                    }, 600);
                    return;
                }

                // MODO REAL: Se a publicApiKey for válida
                try {
                    const separator = path.includes('?') ? '&' : '?';
                    const url = `https://4.dbt.io/api${path}${separator}v=4&key=${publicApiKey}`;
                    
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    if (!res.ok) {
                        throw new Error(data.error?.message || data.message || `Erro HTTP ${res.status}`);
                    }
                    
                    setResponse(data);
                    setActiveTab('visual');
                    
                    if (!history.includes(path)) {
                        setHistory(prev => [path, ...prev].slice(0, 8));
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen bg-slate-100 font-sans text-slate-900 overflow-hidden relative">
                    
                    {/* Sidebar Esquerda */}
                    <div className="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 z-10 shadow-sm max-h-[40vh] md:max-h-full overflow-y-auto">
                        <div className="p-6 border-b border-slate-100 sticky top-0 bg-white z-20">
                            <h1 className="text-xl font-bold text-indigo-900 flex items-center gap-2">
                                <Icon name="Globe" className="w-6 h-6 text-indigo-600" />
                                Creative Bible Apps
                            </h1>
                            <p className="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Exploração Digital Bible Platform</p>
                        </div>

                        <div className="p-4 mt-2">
                            <h2 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">Exemplos de Utilização</h2>
                            <ul className="space-y-2">
                                {presets.map(p => (
                                    <li key={p.name}>
                                        <button
                                            onClick={() => { setEndpoint(p.path); executeRequest(p.path); }}
                                            className="w-full text-left px-3 py-3 rounded-lg hover:bg-indigo-50 border border-transparent hover:border-indigo-100 text-slate-600 hover:text-indigo-700 transition flex items-start gap-3 text-sm font-medium group"
                                        >
                                            <div className="mt-0.5"><Icon name={p.icon} className="w-5 h-5 opacity-70 group-hover:opacity-100" /></div>
                                            <div>
                                                <div className="font-bold text-slate-800 group-hover:text-indigo-800">{p.name}</div>
                                                <div className="text-xs text-slate-400 font-normal mt-0.5">{p.desc}</div>
                                            </div>
                                        </button>
                                    </li>
                                ))}
                            </ul>

                            {history.length > 0 && (
                                <div className="mt-8">
                                    <h2 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">Histórico Recente</h2>
                                    <ul className="space-y-1">
                                        {history.map((h, i) => (
                                            <li key={i}>
                                                <button
                                                    onClick={() => { setEndpoint(h); executeRequest(h); }}
                                                    className="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100 text-slate-500 transition flex items-center text-xs font-mono truncate"
                                                    title={h}
                                                >
                                                    {h}
                                                </button>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Área Principal Direita */}
                    <div className="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-slate-50 relative">
                        
                        {/* Aviso de Modo Demo (Aparece apenas quando não há chave real) */}
                        {publicApiKey === 'SUA_CHAVE_API_AQUI' && (
                            <div className="bg-amber-100 text-amber-800 text-xs px-4 py-2 text-center font-medium flex items-center justify-center gap-2 border-b border-amber-200 shadow-sm shrink-0">
                                <Icon name="AlertCircle" className="w-4 h-4" />
                                Modo de Demonstração Ativo. Utilizando dados estáticos para exemplificar o fluxo do sistema.
                            </div>
                        )}

                        {/* Barra de Endereço */}
                        <div className="bg-white border-b border-slate-200 p-4 md:px-6 shrink-0 flex flex-col md:flex-row items-stretch md:items-center gap-3 shadow-sm z-10">
                            <div className="flex-1 flex items-center bg-slate-50 rounded-lg border border-slate-300 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-200 overflow-hidden transition shadow-sm">
                                <span className="px-3 md:px-4 py-3 text-slate-500 font-bold text-xs md:text-sm bg-slate-200/50 border-r border-slate-300 select-none">GET</span>
                                <span className="pl-3 text-slate-400 font-mono text-xs md:text-sm select-none hidden sm:inline">https://4.dbt.io/api</span>
                                <input
                                    type="text"
                                    value={endpoint}
                                    onChange={e => setEndpoint(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && executeRequest()}
                                    className="flex-1 bg-transparent px-2 md:px-3 py-3 outline-none font-mono text-xs md:text-sm text-slate-800"
                                    placeholder="/bibles?language_code=por"
                                />
                            </div>
                            <button
                                onClick={() => executeRequest()}
                                disabled={loading}
                                className="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white px-6 py-3 rounded-lg font-semibold flex items-center justify-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm"
                            >
                                {loading ? (
                                    <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                ) : (
                                    <><Icon name="Play" className="w-5 h-5" /> Enviar</>
                                )}
                            </button>
                        </div>

                        {/* Corpo */}
                        <div className="flex-1 flex flex-col overflow-hidden relative">
                            {/* Abas */}
                            <div className="flex border-b border-slate-200 px-2 md:px-6 pt-2 bg-white shrink-0">
                                <button
                                    className={`px-5 py-3 font-semibold text-sm border-b-2 transition flex items-center gap-2 ${activeTab === 'visual' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`}
                                    onClick={() => setActiveTab('visual')}
                                >
                                    <Icon name="Layout" className="w-4 h-4" /> Visualização Smart
                                </button>
                                <button
                                    className={`px-5 py-3 font-semibold text-sm border-b-2 transition flex items-center gap-2 ${activeTab === 'json' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`}
                                    onClick={() => setActiveTab('json')}
                                >
                                    <Icon name="Code" className="w-4 h-4" /> Resposta JSON
                                </button>
                            </div>

                            {/* Área de Resposta */}
                            <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50">
                                {error && (
                                    <div className="mb-6 p-5 bg-red-50 border border-red-200 text-red-800 rounded-xl flex items-start gap-3 shadow-sm">
                                        <Icon name="AlertCircle" className="w-6 h-6 shrink-0 text-red-500" />
                                        <div>
                                            <h3 className="font-bold text-red-900">Erro na requisição</h3>
                                            <p className="text-sm mt-1 text-red-700 font-mono bg-red-100/50 p-2 rounded mt-2">{error}</p>
                                        </div>
                                    </div>
                                )}

                                {loading ? (
                                    <div className="flex flex-col items-center justify-center h-full text-slate-400">
                                        <svg className="animate-spin h-12 w-12 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        <p className="animate-pulse">Consultando API...</p>
                                    </div>
                                ) : response ? (
                                    activeTab === 'visual' ? (
                                        <Visualizer response={response} onNavigate={(path) => { setEndpoint(path); executeRequest(path); }} />
                                    ) : (
                                        <div className="h-full relative">
                                            <pre className="absolute inset-0 bg-slate-900 text-emerald-400 p-6 rounded-xl overflow-auto text-sm font-mono shadow-inner border border-slate-800">
                                                {JSON.stringify(response, null, 2)}
                                            </pre>
                                        </div>
                                    )
                                ) : (
                                    <div className="flex flex-col items-center justify-center h-full text-slate-400 select-none">
                                        <Icon name="Library" className="w-24 h-24 text-slate-200 mb-6" />
                                        <h2 className="text-2xl font-bold text-slate-700 mb-2">Bem-vindo ao Creative Bible Apps</h2>
                                        <p className="text-base mt-2 text-center max-w-lg text-slate-500">
                                            Explore os vastos recursos da <strong>Digital Bible Platform</strong>. 
                                            Utilize o menu lateral para ver exemplos de como buscar idiomas, versões da Bíblia, textos e áudios.
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
