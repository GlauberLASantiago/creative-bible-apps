<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Bible Apps - Showcase DBP4</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0f172a; /* Dark theme for multimedia focus */
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }

        .highlight-karaoke {
            background-color: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-radius: 4px;
            padding: 2px 4px;
            transition: all 0.3s ease;
        }

        /* Simulação de texto formatado HTML/CSS */
        .formatted-bible-text h3 { color: #cbd5e1; font-size: 1.25rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .formatted-bible-text p { margin-bottom: 1rem; line-height: 1.8; }
        .formatted-bible-text .poetry { padding-left: 2rem; border-left: 2px solid #334155; font-style: italic; color: #94a3b8; }
        .formatted-bible-text .jesus-words { color: #fca5a5; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Film: <path strokeLinecap="round" strokeLinejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />,
                Volume2: <path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />,
                FileText: <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,
                Wifi: <path strokeLinecap="round" strokeLinejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />,
                Play: <path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />,
                Pause: <path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
                Database: <path strokeLinecap="round" strokeLinejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                    {icons[name] || icons.FileText}
                </svg>
            );
        };

        // --- COMPONENTE 1: Áudio Sincronizado (Audio Timing) ---
        const AudioTimingShowcase = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const intervalRef = useRef(null);

            // Dados simulados da API DBP4 (/timestamps)
            const verses = [
                { id: 1, start: 0, end: 4.5, text: "No princípio criou Deus os céus e a terra." },
                { id: 2, start: 4.5, end: 11.2, text: "E a terra era sem forma e vazia; e havia trevas sobre a face do abismo;" },
                { id: 3, start: 11.2, end: 15.0, text: "e o Espírito de Deus se movia sobre a face das águas." },
                { id: 4, start: 15.0, end: 18.5, text: "E disse Deus: Haja luz; e houve luz." },
                { id: 5, start: 18.5, end: 24.0, text: "E viu Deus que era boa a luz; e fez Deus separação entre a luz e as trevas." }
            ];

            const togglePlay = () => {
                if (isPlaying) {
                    clearInterval(intervalRef.current);
                } else {
                    intervalRef.current = setInterval(() => {
                        setCurrentTime(prev => {
                            if (prev >= 25) { clearInterval(intervalRef.current); setIsPlaying(false); return 0; }
                            return prev + 0.1;
                        });
                    }, 100);
                }
                setIsPlaying(!isPlaying);
            };

            useEffect(() => { return () => clearInterval(intervalRef.current); }, []);

            return (
                <div className="p-8 max-w-4xl mx-auto animation-fade-in">
                    <div className="mb-8 border-b border-slate-700 pb-6">
                        <span className="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded uppercase tracking-wider mb-2 inline-block">DBP4 Feature</span>
                        <h2 className="text-3xl font-bold text-white flex items-center gap-3">
                            <Icon name="Volume2" className="w-8 h-8 text-indigo-400" />
                            Audio Timing (Karaoke Sync)
                        </h2>
                        <p className="text-slate-400 mt-3 text-lg">A API DBP4 agora fornece o tempo exato de início (<code className="bg-slate-800 px-1 rounded">verse_start</code>) de cada versículo em centenas de biblias. Isto permite criar experiências de leitura imersivas onde o texto acompanha o áudio perfeitamente.</p>
                    </div>

                    <div className="bg-slate-800/50 border border-slate-700 p-8 rounded-2xl shadow-xl relative overflow-hidden">
                        {/* Player Controls */}
                        <div className="flex items-center gap-4 mb-8 bg-slate-900/80 p-4 rounded-xl backdrop-blur-sm border border-slate-700/50">
                            <button onClick={togglePlay} className="bg-indigo-500 hover:bg-indigo-600 text-white p-3 rounded-full transition shadow-lg shadow-indigo-500/30">
                                <Icon name={isPlaying ? "Pause" : "Play"} className="w-6 h-6" />
                            </button>
                            <div className="flex-1 bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div className="bg-indigo-400 h-full transition-all duration-100 ease-linear" style={{ width: `${(currentTime / 25) * 100}%` }}></div>
                            </div>
                            <span className="text-slate-400 font-mono text-sm">{currentTime.toFixed(1)}s / 25.0s</span>
                        </div>

                        {/* Text Render */}
                        <div className="text-2xl leading-loose font-serif text-slate-300">
                            {verses.map((v) => {
                                const isActive = currentTime >= v.start && currentTime < v.end;
                                return (
                                    <span key={v.id} className={`transition-all duration-300 ${isActive ? 'highlight-karaoke' : ''}`}>
                                        <sup className="text-sm text-slate-500 font-sans font-bold mr-1 select-none">{v.id}</sup>
                                        {v.text}{' '}
                                    </span>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE 2: Formatted Text ---
        const FormattedTextShowcase = () => {
            return (
                <div className="p-8 max-w-4xl mx-auto animation-fade-in">
                    <div className="mb-8 border-b border-slate-700 pb-6">
                        <span className="bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded uppercase tracking-wider mb-2 inline-block">DBP4 Feature</span>
                        <h2 className="text-3xl font-bold text-white flex items-center gap-3">
                            <Icon name="FileText" className="w-8 h-8 text-emerald-400" />
                            Textos Bíblicos Formatados
                        </h2>
                        <p className="text-slate-400 mt-3 text-lg">Diga adeus ao "plain-text" monótono. A DBP4 oferece <code className="bg-slate-800 px-1 rounded">text_format</code> filesets que incluem marcações HTML/CSS para preservar a intenção tipográfica original: poesia em itálico recuado, palavras de Jesus em vermelho, e cabeçalhos de secção.</p>
                    </div>

                    <div className="bg-[#fcf8f2] text-slate-800 p-10 rounded-2xl shadow-xl font-serif text-lg formatted-bible-text border-4 border-slate-800">
                        <h2 className="text-3xl font-bold text-center mb-6 text-slate-900 border-b border-slate-300 pb-4">Mateus 5</h2>
                        
                        <h3>O Sermão do Monte</h3>
                        <p>1 Vendo Jesus as multidões, subiu ao monte, e, como se assentasse, aproximaram-se os seus discípulos; 2 e ele passou a ensiná-los, dizendo:</p>
                        
                        <h3>As Bem-aventuranças</h3>
                        <div className="poetry jesus-words">
                            3 Bem-aventurados os humildes de espírito, porque deles é o reino dos céus.<br/>
                            4 Bem-aventurados os que choram, porque serão consolados.<br/>
                            5 Bem-aventurados os mansos, porque herdarão a terra.
                        </div>
                        
                        <p className="mt-4 text-sm text-slate-500 text-center uppercase tracking-widest border-t border-slate-200 pt-4 mt-8">Renderizado via DBP4 HTML Fileset</p>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE 3: Gospel Films ---
        const GospelFilmsShowcase = () => {
            return (
                <div className="p-8 max-w-5xl mx-auto animation-fade-in">
                    <div className="mb-8 border-b border-slate-700 pb-6">
                        <span className="bg-rose-600 text-white text-xs font-bold px-2 py-1 rounded uppercase tracking-wider mb-2 inline-block">DBP4 Feature</span>
                        <h2 className="text-3xl font-bold text-white flex items-center gap-3">
                            <Icon name="Film" className="w-8 h-8 text-rose-400" />
                            Gospel Films & OBT
                        </h2>
                        <p className="text-slate-400 mt-3 text-lg">A DBP4 une as traduções de áudio (incluindo Oral Bible Translation - OBT) com conteúdo de vídeo, produzindo filmes evangélicos incrivelmente precisos palavra-por-palavra, acessíveis através de <code className="bg-slate-800 px-1 rounded">video_stream</code> filesets.</p>
                    </div>

                    <div className="relative rounded-2xl overflow-hidden shadow-2xl bg-black border border-slate-800 aspect-video flex items-center justify-center group cursor-pointer">
                        {/* Mock Video Thumbnail */}
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80 z-10"></div>
                        <img src="https://images.unsplash.com/photo-1544391717-d2054ff8dfdb?auto=format&fit=crop&q=80&w=1200" alt="Film Thumbnail" className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-700" />
                        
                        <div className="relative z-20 flex flex-col items-center">
                            <button className="bg-rose-600/90 text-white p-5 rounded-full backdrop-blur-md shadow-lg shadow-rose-900/50 group-hover:bg-rose-500 transition-colors transform group-hover:scale-110 duration-300">
                                <Icon name="Play" className="w-10 h-10 ml-1" />
                            </button>
                            <h3 className="mt-6 text-2xl font-bold text-white tracking-wide drop-shadow-lg">O Evangelho de Lucas</h3>
                            <p className="text-rose-200 font-medium bg-black/50 px-3 py-1 rounded-full mt-2 text-sm backdrop-blur-sm border border-rose-900/50">HLS Video Stream • OBT Audio</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE 4: Adaptive Streaming ---
        const AdaptiveStreamingShowcase = () => {
            return (
                <div className="p-8 max-w-4xl mx-auto animation-fade-in">
                    <div className="mb-8 border-b border-slate-700 pb-6">
                        <span className="bg-cyan-600 text-white text-xs font-bold px-2 py-1 rounded uppercase tracking-wider mb-2 inline-block">DBP4 Feature</span>
                        <h2 className="text-3xl font-bold text-white flex items-center gap-3">
                            <Icon name="Wifi" className="w-8 h-8 text-cyan-400" />
                            Adaptive Bitrate & Formatos Leves
                        </h2>
                        <p className="text-slate-400 mt-3 text-lg">A era do 64kbps mp3 fixo acabou. A Bible Brain agora codifica os áudios em múltiplos formatos como <strong>Opus</strong> e <strong>AAC</strong> de baixo bitrate, perfeitos para missões em áreas remotas. Além disso, fornece streams <strong>HLS</strong> para adaptação inteligente à velocidade da rede.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 hover:border-cyan-500/50 transition">
                            <div className="w-12 h-12 bg-cyan-900/50 rounded-lg flex items-center justify-center mb-4">
                                <span className="font-bold text-cyan-400">HLS</span>
                            </div>
                            <h3 className="text-xl font-bold text-white mb-2">HTTP Live Streaming</h3>
                            <p className="text-slate-400 text-sm">A qualidade do áudio ajusta-se automaticamente de acordo com a ligação 3G/4G/WiFi do utilizador, evitando interrupções (buffering).</p>
                            <div className="mt-4 bg-slate-900 rounded p-3 font-mono text-xs text-cyan-300 overflow-hidden break-all">
                                https://4.dbt.io/api/audio/stream/.../playlist.m3u8
                            </div>
                        </div>

                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 hover:border-purple-500/50 transition">
                            <div className="w-12 h-12 bg-purple-900/50 rounded-lg flex items-center justify-center mb-4">
                                <span className="font-bold text-purple-400">OPUS</span>
                            </div>
                            <h3 className="text-xl font-bold text-white mb-2">Codec Opus (Low Bitrate)</h3>
                            <p className="text-slate-400 text-sm">Qualidade de voz cristalina utilizando uma fração dos dados móveis necessários por um MP3 tradicional. Ideal para distribuição offline rápida.</p>
                            <div className="mt-4 bg-slate-900 rounded p-3 font-mono text-xs text-purple-300 overflow-hidden break-all">
                                filesets[...].codec = "opus"
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            const [activeTab, setActiveTab] = useState('audio-timing');

            const menuItems = [
                { id: 'audio-timing', icon: 'Volume2', label: 'Áudio Sincronizado', desc: 'Audio Timing & Karaoke' },
                { id: 'formatted-text', icon: 'FileText', label: 'Textos Formatados', desc: 'HTML/CSS nativo' },
                { id: 'gospel-films', icon: 'Film', label: 'Gospel Films', desc: 'Vídeo c/ Áudio Exato' },
                { id: 'adaptive', icon: 'Wifi', label: 'Streaming Adaptativo', desc: 'HLS, Opus, AAC' },
            ];

            return (
                <div className="flex flex-col md:flex-row h-screen bg-slate-900 font-sans text-slate-100 overflow-hidden">
                    
                    {/* Sidebar */}
                    <div className="w-full md:w-80 bg-slate-950 border-r border-slate-800 flex flex-col shrink-0 z-10 shadow-2xl">
                        <div className="p-6 border-b border-slate-800 bg-slate-950">
                            <h1 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icon name="Database" className="w-6 h-6 text-indigo-500" />
                                Bible Apps Suite
                            </h1>
                            <p className="text-xs text-indigo-400 mt-1 uppercase tracking-wider font-bold">Bible Brain v4 Showcase</p>
                        </div>

                        <div className="p-4 flex-1 overflow-y-auto">
                            <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-4 px-2">Capacidades da Plataforma</h2>
                            <ul className="space-y-2">
                                {menuItems.map(item => (
                                    <li key={item.id}>
                                        <button
                                            onClick={() => setActiveTab(item.id)}
                                            className={`w-full text-left px-4 py-3 rounded-xl transition flex items-start gap-3 group border ${
                                                activeTab === item.id 
                                                ? 'bg-slate-800 border-indigo-500/50 text-white shadow-lg shadow-indigo-900/20' 
                                                : 'border-transparent hover:bg-slate-800/50 text-slate-400 hover:text-slate-200'
                                            }`}
                                        >
                                            <div className={`mt-0.5 p-1.5 rounded-lg ${activeTab === item.id ? 'bg-indigo-500/20 text-indigo-400' : 'bg-slate-800 text-slate-500 group-hover:text-slate-300'}`}>
                                                <Icon name={item.icon} className="w-5 h-5" />
                                            </div>
                                            <div>
                                                <div className={`font-bold ${activeTab === item.id ? 'text-white' : 'text-slate-300'}`}>{item.label}</div>
                                                <div className="text-xs mt-0.5 opacity-70">{item.desc}</div>
                                            </div>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </div>
                        
                        <div className="p-4 border-t border-slate-800 bg-slate-900/50 text-center text-xs text-slate-500">
                            Ambiente de Demonstração (Mock Data) construído para ilustrar a documentação oficial da DBP4.
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0 h-full overflow-y-auto bg-slate-900 relative bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-slate-950">
                        {activeTab === 'audio-timing' && <AudioTimingShowcase />}
                        {activeTab === 'formatted-text' && <FormattedTextShowcase />}
                        {activeTab === 'gospel-films' && <GospelFilmsShowcase />}
                        {activeTab === 'adaptive' && <AdaptiveStreamingShowcase />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
